http:
  routers:
    nas-router:
      rule: "Host(`nas.intranet.xbhl.online`)"
      entryPoints:
        - "websecure"
      service: nas

    redirect-router:
      rule: "Host(`nas.xbhl.online`)"
      entryPoints:
        - "websecure"
      middlewares:
        - main-to-intranet-qnap-redirect
      service: noop@internal

    s3-router:
      rule: "Host(`s3.intranet.xbhl.online`)"
      entryPoints:
        - "websecure"
      service: nas-object-storage

    object-storage-nas-router:
      rule: "Host(`objectstorage.nas.intranet.xbhl.online`)"
      entryPoints:
        - "websecure"
      service: nas-object-storage

    mcp-nas-router:
      rule: "Host(`mcp.nas.intranet.xbhl.online`)"
      entryPoints:
        - "websecure"
      service: nas-mcp

  middlewares:
    main-to-intranet-qnap-redirect:
      redirectRegex:
        regex: "^https://nas.xbhl.online/(.*)"
        replacement: "https://nas.intranet.xbhl.online/${1}"

  serversTransports:
    qnap-transport:
      insecureSkipVerify: true

  services:
    nas:
      loadBalancer:
        servers:
          - url: "https://nas.srv.xbhl.intranet:8080"
        serversTransport: "qnap-transport"
    nas-object-storage:
      loadBalancer:
        servers:
          - url: "http://nas.srv.xbhl.intranet:8010"
    nas-mcp:
      loadBalancer:
        servers:
          - url: "http://nas.srv.xbhl.intranet:8442/mcp"

tcp:
  routers:
    ldap-router:
      rule: "HostSNI(`ldap.intranet.xbhl.online`)"
      entryPoints:
        - "websecure"
      service: ldap-nas
      tls: {}
      
  services:
    ldap-nas:
      loadBalancer:
        servers:
          - address: "nas.srv.xbhl.intranet:389"
